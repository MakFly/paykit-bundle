<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&family=Instrument+Sans:wght@400..700&family=Public+Sans:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Schibsted+Grotesk:wght@400..700&display=swap"
    />
    <script>
      // Avoids a light flash on the Plume app pages, the only themed ones.
      const stored = localStorage.getItem("vite-ui-theme") || "system";
      if (/^#\/plume\/(app|facturation)/.test(location.hash) && (stored === "dark" || (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches)))
        document.documentElement.classList.add("dark");
    </script>
    <meta
      name="description"
      content="Deux applications de démonstration du bundle PayKit pour Symfony : la boutique Établi et l'assistant d'écriture Plume."
    />
    <title>Établi et Plume, démos PayKit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
