name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, mbstring
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  # Single stable status check to mark as "required" in branch protection,
  # so matrix changes never require editing the protection rules.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [tests, phpstan]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ needs.tests.result }}" = "success" ] && [ "${{ needs.phpstan.result }}" = "success" ]
