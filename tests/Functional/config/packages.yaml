framework:
    test: true
    secret: test
    http_method_override: false
    handle_all_throwables: true
    php_errors: { log: true }

doctrine:
    dbal:
        driver: pdo_sqlite
        url: 'sqlite:///:memory:'
    orm:
        # PayKit maps its own entities; no app mappings needed here.
        auto_generate_proxy_classes: true
        controller_resolver: { auto_mapping: false }

paykit:
    provider: fake
    currency: eur
    features:
        messages: metered
        pro_models: boolean
    plans:
        free:
            group: base
            default: true
            includes:
                messages: { limit: 2, reset: month }
        pro:
            group: base
            price: { amount: 19, interval: month }
            includes:
                messages: { limit: 2000, reset: month }
                pro_models: ~
